name: Verificar Trama8583
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y probar
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Ejecutar el catálogo desde el JAR autónomo
        run: java -jar trama8583-escenarios/target/trama8583-escenarios-1.0-SNAPSHOT.jar --todos
      - name: Comprobar carga concurrente breve
        run: >-
          java -Xms128m -Xmx256m -jar trama8583-escenarios/target/trama8583-escenarios-1.0-SNAPSHOT.jar
          --estres --hilos 2 --segundos 2 --calentamiento 1 --carga mixta --salida target/estres/ci.json
      - name: Conservar medición de carga
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medicion-carga-ci
          path: target/estres/
          if-no-files-found: ignore
          retention-days: 30
